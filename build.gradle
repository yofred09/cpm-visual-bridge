plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.142'
    id 'idea'
}

version = mod_version
group = mod_group_id

repositories {
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
    maven {
        name = "CurseMaven"
        url = "https://cursemaven.com"
        content { includeGroup "curse.maven" }
    }
    maven { url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/" }
    flatDir { dirs 'libs' }
}

base { archivesName = mod_id }

tasks.named('jar', Jar).configure {
    archiveFileName = "${mod_id}-${mod_version}-neoforge-${minecraft_version}.jar"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version
    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }
    runs {
        client {
            client()
            gameDirectory = project.file('run')
            programArguments.addAll '--username', 'Dev'
        }
        configureEach { logLevel = org.slf4j.event.Level.INFO }
    }
    mods {
        "${mod_id}" { sourceSet(sourceSets.main) }
    }
}

configurations { runtimeClasspath.extendsFrom localRuntime }

dependencies {
    // CPM is the purpose of this client addon and is required for users.
    localRuntime "maven.modrinth:custom-player-models:${cpm_version}"

    // Every target integration remains optional and is never packaged.
    compileOnly "maven.modrinth:createcybernetics:${cybernetics_version}"
    compileOnly "curse.maven:relics-mod-${relics_curse_project}:${relics_curse_file}"
    compileOnly "curse.maven:mowzies-mobs-${mowzies_curse_project}:${mowzies_curse_file}"
    compileOnly "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"
    compileOnly "maven.modrinth:pehkui:${pehkui_version}"
    localRuntime "maven.modrinth:pehkui:${pehkui_version}"
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version: minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version: neo_version,
            loader_version_range: loader_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

idea.module {
    downloadSources = true
    downloadJavadoc = true
}
